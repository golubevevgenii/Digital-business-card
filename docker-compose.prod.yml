services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.16
    container_name: cv_cockroachdb
    restart: always
    command: start-single-node --insecure --accept-sql-without-tls --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - cockroach_data:/cockroach/cockroach-data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv_nestjs_app
    restart: always
    depends_on:
      cockroachdb:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      USER_ID: ${USER_ID}
    command: sh -c "npx prisma db push --accept-data-loss && node dist/main.js"

volumes:
  cockroach_data: